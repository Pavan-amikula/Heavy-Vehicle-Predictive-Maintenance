<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Maintenance ML</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="/" class="nav-logo">
                <i class="fas fa-truck-pickup"></i> <span>Maintenance ML</span>
            </a>
            <ul class="nav-menu">
                <li><a href="/" class="nav-link"><i class="fas fa-home"></i> Home</a></li>
                <li><a href="/signin" class="nav-link"><i class="fas fa-sign-in-alt"></i> Login</a></li>
            </ul>
        </div>
    </nav>

    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <i class="fas fa-user-plus"></i>
                <h1 class="auth-title">Join Us</h1>
                <p class="auth-subtitle">Start your diagnostic journey</p>
            </div>

            {% if message %}
            <div class="alert-message">
                <i class="fas fa-exclamation-circle"></i> {{ message }}
            </div>
            {% endif %}

            <form class="auth-form" action="/signup" method="POST">
                <div class="input-group">
                    <label for="user">Username</label>
                    <div class="input-wrapper">
                        <i class="fas fa-at"></i>
                        <input type="text" id="user" name="user" placeholder="min. 6 characters" required pattern=".{6,}" title="Username must be at least 6 characters.">
                    </div>
                </div>

                <div class="input-group">
                    <label for="name">Full Name</label>
                    <div class="input-wrapper">
                        <i class="fas fa-signature"></i>
                        <input type="text" id="name" name="name" placeholder="Your full name" required pattern="[A-Za-z ]{3,}" title="Full Name must be at least 3 letters, only letters and spaces allowed.">
                    </div>
                </div>

                <div class="input-group">
                    <label for="email">Email Address</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="email" name="email" placeholder="email@example.com" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="mobile">Mobile Number</label>
                    <div class="input-wrapper">
                        <i class="fas fa-phone"></i>
                        <input type="tel" id="mobile" name="mobile" placeholder="10-digit mobile" required pattern="[6-9][0-9]{9}" title="Mobile must start with 6-9 and be 10 digits.">
                    </div>
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" name="password" placeholder="••••••••" required pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}" title="Password must be at least 8 characters, with an uppercase letter, a number, and a lowercase letter.">
                    </div>
                </div>

                <button type="submit" class="auth-submit-btn">
                    <i class="fas fa-check"></i> Create Account
                </button>
            </form>

            <div class="auth-footer">
                Already have an account? <a href="/signin" class="auth-link">Sign in here</a>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
